[project]
name = "CuSSS"
version = "0.1.0"
description = "CUDA implementaiton of SSS variants"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "nvtx",
    "pre-commit>=4.5.0",
]

[build-system]
requires = [
    "setuptools >= 69",
    "wheel >=0.45",
    "cmake >=3.30",
    "torch >= 2.0",
]

build-backend = "setuptools.build_meta"

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]  # Assume 'cusss' folder is at the root of your repo
include = ["cusss*"]  # Include cusss and all its subpackages (cusss.child1, etc.)

[project.optional-dependencies]
tests = [
    "pytest",
]
